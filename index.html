<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Geoffrin Edwin — Content Engineer | GTM & Technical Systems</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#0D1117;
    --paper-card:#161B22;
    --paper-subtle:#21262D;
    --ink:#F0F6FC;
    --ink-soft:#8B949E;
    --rule:#30363D;
    --accent:#58A6FF;
    --accent-glow:rgba(88, 166, 255, 0.15);
    --badge-bg:#1F242C;
    --max-width:940px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  a{color:var(--accent); text-decoration:none;}
  a:hover{text-decoration:underline;}
  a:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  code{font-family:'IBM Plex Mono', monospace; font-size:0.9em; background:var(--paper-subtle); padding:2px 6px; border-radius:4px; color:#79C0FF;}

  .page{
    max-width:var(--max-width);
    margin:0 auto;
    min-height:100vh;
    padding:0 0 60px;
  }

  .identity{padding:48px 40px 0;}
  .name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2.3rem;
    letter-spacing:-0.02em;
    margin:0 0 6px;
    color:#FFFFFF;
  }
  .role-tag{
    color:var(--accent);
    font-size:1.05rem;
    font-weight:500;
    margin:0 0 24px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .role-tag span{color:var(--ink-soft); font-size:0.9rem;}

  .tabs{
    display:flex;
    gap:8px;
    padding:0 40px;
    border-bottom:1px solid var(--rule);
  }
  .tab-btn{
    font-family:'IBM Plex Sans', sans-serif;
    font-size:0.95rem;
    font-weight:500;
    background:none;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    color:var(--ink-soft);
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color 0.15s ease;
  }
  .tab-btn[aria-selected="true"]{
    color:#FFFFFF;
    border-bottom:2px solid var(--accent);
  }
  .tab-btn:hover{color:#FFFFFF;}

  .tab-panel{display:none; padding:36px 40px;}
  .tab-panel.active{display:block;}

  .pitch-lede{
    font-family:'Fraunces', serif;
    font-size:1.5rem;
    font-weight:500;
    max-width:40ch;
    margin:0 0 32px;
    line-height:1.35;
    color:#FFFFFF;
  }
  .pitch-lede em{font-style:normal; color:var(--accent);}

  .pitch-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:20px;
    margin-bottom:36px;
  }

  .pitch-card{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:22px 26px;
    position:relative;
    transition:border-color 0.2s ease;
  }
  .pitch-card:hover{
    border-color:#58A6FF66;
  }
  .pitch-card h3{
    font-size:1.05rem;
    font-weight:600;
    margin:0 0 10px;
    color:#FFFFFF;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .pitch-card h3 .pill{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.75rem;
    font-weight:400;
    color:var(--accent);
    background:var(--accent-glow);
    padding:2px 8px;
    border-radius:12px;
  }
  .pitch-card p{margin:0; color:var(--ink); font-size:0.95rem; line-height:1.6;}
  .pitch-card ul{margin:10px 0 0; padding-left:20px; color:var(--ink-soft); font-size:0.92rem;}
  .pitch-card li{margin-bottom:4px;}

  .proof-box{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:8px;
    padding:24px;
    margin-bottom:32px;
  }
  .proof-box h2{
    font-size:1.1rem;
    font-weight:600;
    margin:0 0 16px;
